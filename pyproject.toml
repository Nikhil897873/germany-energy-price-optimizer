[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gridshift-de"
version = "0.1.0"
description = "Day-ahead German electricity price forecasting and flexible-load optimization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "Nikhil Balne" }]
keywords = ["electricity", "forecasting", "germany", "smard", "dwd", "energy", "dbt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "duckdb>=1.1,<2",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pydantic-settings>=2.5,<3",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.5,<5"]
dashboard = ["plotly>=5.24,<7", "streamlit>=1.39,<2"]
dbt = ["dbt-duckdb>=1.9,<2"]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-requests>=2.32",
]
all = [
  "dbt-duckdb>=1.9,<2",
  "lightgbm>=4.5,<5",
  "plotly>=5.24,<7",
  "streamlit>=1.39,<2",
]

[project.scripts]
gridshift = "gridshift.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gridshift"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --cov-fail-under=75"
testpaths = ["tests"]
markers = ["slow: end-to-end integration tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
