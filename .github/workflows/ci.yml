name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,ml,dbt]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=gridshift --cov-report=term-missing
      - name: End-to-end smoke test
        run: gridshift run --demo --days 180 --splits 2
      - name: dbt models and tests
        run: gridshift dbt-build

